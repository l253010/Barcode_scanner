name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build scanner, generator and tests
        shell: cmd
        working-directory: barcode
        run: call build.bat all

      - name: Run automated tests
        shell: cmd
        working-directory: barcode
        run: call build.bat test
